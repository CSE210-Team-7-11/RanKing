<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">HTTP API route tree</title>
  <desc id="desc">The base path /api/v1 branches into scores, users, and games. Scores optionally continues to gid and then type. Users optionally continues to id, gid, and type. Games optionally continues to gid. Dashed arrows indicate optional segments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="290" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="2">
    <path d="M 135 40 H 190 V 240 H 230"/>
    <path d="M 190 80 H 230 M 190 160 H 230"/>
    <g stroke-dasharray="7 6" marker-end="url(#arrow)">
      <path d="M 325 80 H 420"/>
      <path d="M 535 80 H 610"/>
      <path d="M 325 160 H 420"/>
      <path d="M 535 160 H 610"/>
      <path d="M 725 160 H 800"/>
      <path d="M 325 240 H 420"/>
    </g>
  </g>
  <g fill="#000" font-family="monospace" font-size="22" dominant-baseline="middle">
    <text x="20" y="40">/api/v1</text>
    <text x="240" y="80">scores</text>
    <text x="440" y="80">&lt;gid&gt;</text>
    <text x="630" y="80">&lt;type&gt;</text>
    <text x="240" y="160">users</text>
    <text x="440" y="160">&lt;id&gt;</text>
    <text x="630" y="160">&lt;gid&gt;</text>
    <text x="820" y="160">&lt;type&gt;</text>
    <text x="240" y="240">games</text>
    <text x="440" y="240">&lt;gid&gt;</text>
  </g>
</svg>
