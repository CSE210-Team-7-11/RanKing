name: Checks

on:
  push:
    branches: [backend, frontend, develop, main]
  pull_request:
    branches: [backend, frontend, develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Source checks and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check release promotion source
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "develop" ] || [ "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "::error::Release PRs to main must come from this repository's develop branch."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - name: Build server
        if: ${{ ((github.base_ref || github.ref_name) == 'develop' || (github.base_ref || github.ref_name) == 'main') && hashFiles('src/server/**/*.ts') != '' }}
        run: npm run build:server
      - name: Build frontend
        if: ${{ ((github.base_ref || github.ref_name) == 'develop' || (github.base_ref || github.ref_name) == 'main') && hashFiles('web/index.html') != '' }}
        run: npm run build:web
      - name: Integration tests
        if: ${{ (github.base_ref || github.ref_name) == 'develop' || (github.base_ref || github.ref_name) == 'main' }}
        run: npm run test:integration

  browser:
    name: Browser tests
    if: ${{ (github.base_ref || github.ref_name) == 'develop' || (github.base_ref || github.ref_name) == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: ${{ (github.base_ref || github.ref_name) != 'main' && hashFiles('tests/browser/**/*', 'tests/at-browser/**/*') != '' }}
        run: npx playwright install --with-deps chromium
      - name: Install desktop browsers
        if: ${{ (github.base_ref || github.ref_name) == 'main' && hashFiles('tests/browser/**/*', 'tests/at-browser/**/*') != '' }}
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        id: browser-tests
        run: |
          npm run ${{ (github.base_ref || github.ref_name) == 'main' && 'test:e2e:desktop' || 'test:e2e' }}
          npm run ${{ (github.base_ref || github.ref_name) == 'main' && 'test:at:desktop' || 'test:at:browser' }}
      - name: Upload browser failure report
        if: ${{ failure() && steps.browser-tests.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
