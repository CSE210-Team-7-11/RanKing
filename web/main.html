<!DOCTYPE html>
<html lang="en">

<head>
    <title>Home | RanKing</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/iconify-icon@3/dist/iconify-icon.min.js"></script>
    <script type="module" src="./main.ts"></script>
</head>

<body>
    <header>
        <nav>
            <span>RanKing</span>
            <a href="main.html" aria-label="Home"><iconify-icon icon="mdi:crown" aria-hidden="true"></iconify-icon></a>
            <a href="library.html" aria-label="Library"><iconify-icon icon="mdi:bookshelf" aria-hidden="true"></iconify-icon></a>
            <a href="games.html" aria-label="Games"><iconify-icon icon="mdi:gamepad-variant" aria-hidden="true"></iconify-icon></a>
            <a href="store.html" aria-label="Store"><iconify-icon icon="mdi:storefront" aria-hidden="true"></iconify-icon></a>
            <a href="account.html" aria-label="Account"><iconify-icon icon="mdi:account-circle" aria-hidden="true"></iconify-icon></a>
            <label for="username">User:</label>
            <input type="text" id="username">
        </nav>
    </header>
    <main>
        <section id="game-container">
            <iframe id="game-frame" title="Sudoku" src="./sudoku.html"></iframe>
        </section>
        <section id="leaderboard">
            <table aria-label="Leaderboard table">
                <caption>Leaderboard</caption>
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="2">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <noscript>You need to enable JavaScript to play this game.</noscript>
    </main>
    <footer>
        <a href="https://github.com/CSE210-Team-7-11/RanKing" target="_blank" aria-label="Github Repo Redirect">GitHub Repo</a>
        <a href="mailto:team711@example.com" aria-label="Contact Us redirect">Contact Us</a>
        <span>&copy; Team 7/11 2026</span>
    </footer>
</body>

</html>
